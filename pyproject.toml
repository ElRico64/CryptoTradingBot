[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memebot"
version = "0.1.0"
description = "Memecoin trading bot: narrative detection, smart-money tracking, safety gates and disciplined exits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "solders>=0.21",
    "eth-account>=0.13",
    "eth-utils>=4.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memebot = "memebot.cli:main"

[tool.setuptools.packages.find]
include = ["memebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
